apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ate-selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pod-identity-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: podidentity.podcert.ate.dev
  secretName: pod-identity-ca-secret
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: ate-selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: podidentity-issuer
spec:
  ca:
    secretName: pod-identity-ca-secret
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: podidentity-trust-bundle
spec:
  sources:
  - secret:
      name: pod-identity-ca-secret
      key: tls.crt
  target:
    configMap:
      key: trust-bundle.pem
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: service-dns-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: servicedns.podcert.ate.dev
  secretName: service-dns-ca-secret
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: ate-selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: servicedns-issuer
spec:
  ca:
    secretName: service-dns-ca-secret
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: servicedns-trust-bundle
spec:
  sources:
  - secret:
      name: service-dns-ca-secret
      key: tls.crt
  target:
    configMap:
      key: trust-bundle.pem
