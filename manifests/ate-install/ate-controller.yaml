kind: Namespace
apiVersion: v1
metadata:
  name: ate-system

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ate-client
  namespace: ate-system
  labels:
    apps: ate-client

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ate-controller
  namespace: ate-system
  labels:
    apps: ate-controller

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ate-controller
subjects:
- kind: ServiceAccount
  name: ate-controller
  namespace: ate-system
roleRef:
  kind: ClusterRole
  name: ate-controller
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ate-controller
  namespace: ate-system
subjects:
- kind: ServiceAccount
  name: ate-controller
  namespace: ate-system
roleRef:
  kind: Role
  name: ate-controller
  apiGroup: rbac.authorization.k8s.io

---

kind: Service
apiVersion: v1
metadata:
  name: ate-controller
  namespace: ate-system
  labels:
    app: ate-controller
spec:
  selector:
    app: ate-controller
  ports:
  - name: metrics
    port: 8080
    targetPort: metrics
    protocol: TCP

---

kind: Deployment
apiVersion: apps/v1
metadata:
  name: ate-controller
  namespace: ate-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ate-controller
  template:
    metadata:
      labels:
        app: ate-controller
    spec:
      serviceAccountName: ate-controller
      containers:
      - name: ate-controller
        image: ko://github.com/agent-substrate/substrate/cmd/atecontroller
        args:
        - --ateapi-ca-file=/run/servicedns-ca/trust-bundle.pem
        - --ateapi-client-cert=/run/podidentity.podcert.ate.dev/tls.crt
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),service.instance.id=$(POD_UID)
        # OTLP exporter settings are shared by every control plane component;
        # see manifests/ate-install/ate-otel-config.yaml. The controller also
        # propagates these to the ateom worker pods it creates.
        envFrom:
        - configMapRef:
            name: ate-otel-config
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        - name: healthz
          containerPort: 8081
          protocol: TCP
        volumeMounts:
        # Controller's own client identity presented to ateapi.
        - name: "podidentity"
          mountPath: "/run/podidentity.podcert.ate.dev"
          readOnly: true
        # Trust bundle used to verify ateapi's servicedns serving cert.
        - name: "servicedns-ca"
          mountPath: "/run/servicedns-ca"
          readOnly: true
      volumes:
      - name: "podidentity"
        csi:
          driver: csi.cert-manager.io
          readOnly: true
          volumeAttributes:
            csi.cert-manager.io/issuer-name: podidentity-issuer
            csi.cert-manager.io/issuer-kind: ClusterIssuer
            csi.cert-manager.io/common-name: "${POD_UID}"
            csi.cert-manager.io/dns-names: "${POD_NAME}.${POD_NAMESPACE}.pod.cluster.local"
            csi.cert-manager.io/uri-sans: "spiffe://cluster.local/ns/${POD_NAMESPACE}/sa/${SERVICE_ACCOUNT_NAME}"
            csi.cert-manager.io/key-encoding: PKCS8
            csi.cert-manager.io/key-algorithm: ECDSA
            csi.cert-manager.io/key-size: "256"
            csi.cert-manager.io/key-usages: "digital signature,key encipherment,server auth,client auth"
      - name: "servicedns-ca"
        configMap:
          name: "servicedns-trust-bundle"
